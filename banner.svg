<svg fill="none" viewBox="0 0 1200 320" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b"/>
      <stop offset="50%" stop-color="#120a2a"/>
      <stop offset="100%" stop-color="#070210"/>
    </linearGradient>

    <linearGradient id="neon-rose-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f0720" stop-opacity="0.95"/>
    </linearGradient>

    <pattern id="hex-grid" width="40" height="69.282" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 20 11.547 L 0 0 L 0 23.094 L 20 34.641 L 40 23.094 Z M 0 34.641 L 20 46.188 L 0 57.735 L 0 80.829 L 20 92.376 L 40 80.829 L 40 57.735 L 20 46.188 Z" fill="none" stroke="#2e1852" stroke-width="0.7" stroke-opacity="0.35"/>
    </pattern>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Background -->
  <rect width="1200" height="320" fill="url(#cyber-bg)" rx="18"/>
  <rect width="1200" height="320" fill="url(#hex-grid)" rx="18"/>

  <!-- Neon Ambient Orbs -->
  <circle cx="150" cy="90" r="140" fill="#ec4899" fill-opacity="0.14" filter="url(#neon-glow)"/>
  <circle cx="1050" cy="230" r="160" fill="#8b5cf6" fill-opacity="0.16" filter="url(#neon-glow)"/>

  <!-- Top Curved Neon Border -->
  <path d="M 0 0 L 1200 0 L 1200 5 L 0 5 Z" fill="url(#neon-rose-purple)"/>

  <!-- Futuristic Main Card Container -->
  <rect x="35" y="30" width="1130" height="260" rx="16" fill="url(#card-grad)" stroke="#3b1d6e" stroke-width="1.5"/>

  <!-- Left Avatar Node Graphic -->
  <g transform="translate(65, 60)">
    <circle cx="70" cy="70" r="60" fill="#130826" stroke="url(#neon-rose-purple)" stroke-width="3"/>
    <circle cx="70" cy="70" r="50" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="4,4"/>
    <!-- Avatar Icon Vector -->
    <path d="M 70 42 C 60 42 52 50 52 60 C 52 70 60 78 70 78 C 80 78 88 70 88 60 C 88 50 80 42 70 42 Z M 70 87 C 56 87 42 96 42 108 L 98 108 C 98 96 84 87 70 87 Z" fill="#ec4899"/>
    <!-- Status Dot -->
    <circle cx="116" cy="116" r="8" fill="#10b981" stroke="#0a051b" stroke-width="2"/>
  </g>

  <!-- Central Profile Title & Information -->
  <g transform="translate(230, 65)">
    <!-- Subtitle Pill -->
    <rect x="0" y="0" width="270" height="26" rx="13" fill="#29124a" stroke="#ec4899" stroke-opacity="0.4"/>
    <text x="135" y="17" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11.5" font-weight="600" fill="#ec4899">✦ COMPUTER SCIENCE &amp; ENGINEERING ✦</text>

    <!-- Main Name (Crystal clear 28px font size with perfect margins) -->
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1">MAMATA BALESH KAMAGOUDAR</text>

    <!-- Role Sub-Heading (Removed GNN & RAG Specialist) -->
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="url(#neon-rose-purple)">AI/ML Researcher • MERN Stack Developer</text>

    <!-- Feature Chips Row -->
    <g transform="translate(0, 118)">
      <rect x="0" y="0" width="145" height="30" rx="15" fill="#1b0c36" stroke="#8b5cf6"/>
      <text x="72" y="19" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#d8b4fe">🎓 RVITM (8.53 CGPA)</text>

      <rect x="155" y="0" width="145" height="30" rx="15" fill="#1b0c36" stroke="#ec4899"/>
      <text x="227" y="19" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f472b6">🤖 Machine Learning</text>

      <rect x="310" y="0" width="145" height="30" rx="15" fill="#1b0c36" stroke="#06b6d4"/>
      <text x="382" y="19" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#67e8f9">⚛️ Full-Stack MERN</text>
    </g>
  </g>

  <!-- Right Holographic Snapshot Card -->
  <g transform="translate(900, 50)">
    <rect x="0" y="0" width="220" height="220" rx="14" fill="#120726" stroke="#4c1d95" stroke-width="1"/>
    
    <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#ec4899" letter-spacing="1">PROFILE SNAPSHOT</text>

    <!-- Item 1 -->
    <text x="20" y="65" font-family="-apple-system, sans-serif" font-size="10.5" fill="#9ca3af">DEGREE</text>
    <text x="20" y="82" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#f3e8ff">B.E. CSE (2023-2027)</text>

    <!-- Item 2 -->
    <text x="20" y="112" font-family="-apple-system, sans-serif" font-size="10.5" fill="#9ca3af">ACADEMIC CGPA</text>
    <text x="20" y="130" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="800" fill="#10b981">8.53 / 10.0</text>

    <!-- Item 3 -->
    <text x="20" y="160" font-family="-apple-system, sans-serif" font-size="10.5" fill="#9ca3af">PROJECT FOCUS</text>
    <text x="20" y="178" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8">AIML &amp; MERN Stack</text>

    <!-- Bottom Status -->
    <rect x="15" y="190" width="190" height="22" rx="11" fill="#220c42"/>
    <text x="110" y="205" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#a78bfa">⚡ Active Developer</text>
  </g>
</svg>
