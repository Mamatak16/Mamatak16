<svg fill="none" viewBox="0 0 1200 380" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b"/>
      <stop offset="50%" stop-color="#120a2a"/>
      <stop offset="100%" stop-color="#070210"/>
    </linearGradient>

    <linearGradient id="neon-rose-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f0720" stop-opacity="0.9"/>
    </linearGradient>

    <pattern id="hex-grid" width="40" height="69.282" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 20 11.547 L 0 0 L 0 23.094 L 20 34.641 L 40 23.094 Z M 0 34.641 L 20 46.188 L 0 57.735 L 0 80.829 L 20 92.376 L 40 80.829 L 40 57.735 L 20 46.188 Z" fill="none" stroke="#2e1852" stroke-width="0.7" stroke-opacity="0.3"/>
    </pattern>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Background -->
  <rect width="1200" height="380" fill="url(#cyber-bg)" rx="20"/>
  <rect width="1200" height="380" fill="url(#hex-grid)" rx="20"/>

  <!-- Neon Ambient Orbs -->
  <circle cx="180" cy="100" r="160" fill="#ec4899" fill-opacity="0.15" filter="url(#neon-glow)"/>
  <circle cx="1020" cy="280" r="180" fill="#8b5cf6" fill-opacity="0.18" filter="url(#neon-glow)"/>
  <circle cx="600" cy="60" r="140" fill="#06b6d4" fill-opacity="0.1" filter="url(#neon-glow)"/>

  <!-- Top Curved Neon Border -->
  <path d="M 0 0 L 1200 0 L 1200 6 L 0 6 Z" fill="url(#neon-rose-purple)"/>

  <!-- Futuristic Main Card Container -->
  <rect x="40" y="35" width="1120" height="310" rx="16" fill="url(#card-grad)" stroke="#3b1d6e" stroke-width="1.5"/>

  <!-- Left Avatar Node Graphic -->
  <g transform="translate(80, 80)">
    <circle cx="75" cy="75" r="65" fill="#130826" stroke="url(#neon-rose-purple)" stroke-width="3"/>
    <circle cx="75" cy="75" r="54" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="4,4"/>
    <!-- Avatar Icon Vector -->
    <path d="M 75 45 C 64 45 55 54 55 65 C 55 76 64 85 75 85 C 86 85 95 76 95 65 C 95 54 86 45 75 45 Z M 75 95 C 60 95 45 105 45 118 L 105 118 C 105 105 90 95 75 95 Z" fill="#ec4899"/>
    
    <!-- Status Dot -->
    <circle cx="125" cy="125" r="9" fill="#10b981" stroke="#0a051b" stroke-width="2"/>
  </g>

  <!-- Central Profile Title & Information -->
  <g transform="translate(260, 85)">
    <!-- Subtitle Pill -->
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#29124a" stroke="#ec4899" stroke-opacity="0.4"/>
    <text x="140" y="18" text-anchor="middle" font-family="'Fira Code', monospace" font-size="12" font-weight="600" fill="#ec4899">✦ COMPUTER SCIENCE &amp; ENGINEERING ✦</text>

    <!-- Main Name -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="1.5">MAMATA BALESH KAMAGOUDAR</text>

    <!-- Role Sub-Heading -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="url(#neon-rose-purple)">AI/ML Researcher • MERN Stack Developer • GNN &amp; RAG Specialist</text>

    <!-- Feature Chips Row -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="135" height="32" rx="16" fill="#1b0c36" stroke="#8b5cf6"/>
      <text x="67" y="20" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#d8b4fe">🎓 RVITM (8.53 CGPA)</text>

      <rect x="148" y="0" width="145" height="32" rx="16" fill="#1b0c36" stroke="#ec4899"/>
      <text x="220" y="20" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#f472b6">🤖 Agentic AI &amp; RAG</text>

      <rect x="305" y="0" width="145" height="32" rx="16" fill="#1b0c36" stroke="#06b6d4"/>
      <text x="377" y="20" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#67e8f9">⚛️ Full-Stack MERN</text>

      <rect x="462" y="0" width="145" height="32" rx="16" fill="#1b0c36" stroke="#10b981"/>
      <text x="534" y="20" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#6ee7b7">🌾 GNN &amp; KG AgriTech</text>
    </g>
  </g>

  <!-- Right Holographic Metrics Card -->
  <g transform="translate(900, 70)">
    <rect x="0" y="0" width="220" height="240" rx="14" fill="#120726" stroke="#4c1d95" stroke-width="1"/>
    
    <text x="20" y="35" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#ec4899" letter-spacing="1">PROFILE SNAPSHOT</text>

    <!-- Item 1 -->
    <text x="20" y="70" font-family="-apple-system, sans-serif" font-size="11" fill="#9ca3af">DEGREE</text>
    <text x="20" y="88" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#f3e8ff">B.E. CSE (2023-2027)</text>

    <!-- Item 2 -->
    <text x="20" y="120" font-family="-apple-system, sans-serif" font-size="11" fill="#9ca3af">ACADEMIC CGPA</text>
    <text x="20" y="138" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#10b981">8.53 / 10.0</text>

    <!-- Item 3 -->
    <text x="20" y="170" font-family="-apple-system, sans-serif" font-size="11" fill="#9ca3af">PROJECT FOCUS</text>
    <text x="20" y="188" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">AIML, GNN, MERN</text>

    <!-- Bottom Status -->
    <rect x="15" y="202" width="190" height="24" rx="12" fill="#220c42"/>
    <text x="110" y="218" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#a78bfa">⚡ Active Developer</text>
  </g>
</svg>
